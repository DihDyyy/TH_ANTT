name: Bai 6 - Pipeline co ban

on:
  push:
    paths:
      - '.github/workflows/bai6-basic.yml'
      - 'Bai6/lab06-devsecops/examples/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  STUDENT_NAME: 'Lê Đình Duy'
  STUDENT_ID: '2387700102'
  STUDENT_CLASS: '23DATA1'
  # Map the sample variables from the PDF to GitHub's context.
  GITLAB_USER_LOGIN: ${{ github.actor }}
  CI_COMMIT_BRANCH: ${{ github.ref_name }}

jobs:
  build-job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Thong tin sinh vien
        run: 'echo "$STUDENT_NAME | $STUDENT_ID | $STUDENT_CLASS"'
      - name: Build theo mau
        run: echo "Hello, $GITLAB_USER_LOGIN!"

  test-job1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-job
    steps:
      - name: Test thu nhat
        run: echo "This job tests something"

  test-job2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-job
    steps:
      - name: Test thu hai voi sleep 20
        run: |
          echo "This job tests something, but takes more time than test-job1."
          echo "After the echo commands complete, it runs the sleep command for 20 seconds"
          echo "which simulates a test that runs 20 seconds longer than test-job1"
          sleep 20

  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-job1, test-job2]
    steps:
      - name: Thong bao trien khai theo mau
        run: echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
